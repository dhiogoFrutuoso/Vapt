<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d97706" />
    <title>Vapt — Site de criação de aplicativos para comércios de forma rápida</title>
    <meta
      name="description"
      content="Monte o site e o aplicativo do seu comércio em minutos de forma rápida com o Vapt. Sem taxa por pedido, com suporte no WhatsApp."
    />
    <meta property="og:title" content="Vapt — Aplicativos para comércios de forma rápida" />
    <meta
      property="og:description"
      content="Monte o aplicativo do seu comércio em poucos minutos e comece a vender no Vapt."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" type="image/png" href="/vapt-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <!-- Google Analytics (só inicializa se VITE_GA_ID existir) -->
    <script>
      const gaId = "%VITE_GA_ID%";
      if (gaId && gaId !== "%VITE_GA_ID%" && gaId !== "") {
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', gaId);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
