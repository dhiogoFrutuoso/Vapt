apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def appEnv = [:]
def appEnvFile = file('../../.env.app')
if (appEnvFile.exists()) {
    appEnvFile.eachLine { line ->
        def clean = line.trim()
        if (clean && !clean.startsWith('#') && clean.contains('=')) {
            def separator = clean.indexOf('=')
            appEnv[clean.substring(0, separator).trim()] = clean.substring(separator + 1).trim()
        }
    }
}
def buildSetting = { key -> System.getenv(key) ?: appEnv[key] }
def packageInfo = new JsonSlurper().parseText(file('../../package.json').text)
def appVersionName = buildSetting('VAPT_APP_VERSION') ?: appEnv['VITE_APP_VERSION'] ?: packageInfo.version
def versionParts = appVersionName.tokenize('.').collect { (it =~ /^\d+/)[0] as Integer }
def generatedVersionCode = (versionParts[0] * 1000000) + (versionParts[1] * 1000) + versionParts[2]
def appVersionCode = (buildSetting('VAPT_ANDROID_VERSION_CODE') ?: generatedVersionCode.toString()) as Integer
def signingFile = buildSetting('VAPT_ANDROID_KEYSTORE_FILE')
def useLegacyDebugSigning = buildSetting('VAPT_LEGACY_DEBUG_SIGNING') == 'true'

android {
    buildFeatures { buildConfig true }
    namespace "com.vapt.equipe"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vapt.equipe"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingFile) {
                storeFile file(signingFile)
                storePassword buildSetting('VAPT_ANDROID_KEYSTORE_PASSWORD')
                keyAlias buildSetting('VAPT_ANDROID_KEY_ALIAS')
                keyPassword buildSetting('VAPT_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Existing public APKs use this machine's debug certificate. An explicitly
            // requested migration build keeps that certificate while disabling debugging.
            // Never silently publish an unsigned APK or switch signing identities.
            if (signingFile) signingConfig signingConfigs.release
            else if (useLegacyDebugSigning) signingConfig signingConfigs.debug
            else if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                throw new GradleException('Release signing is required: configure VAPT_ANDROID_KEYSTORE_FILE or explicitly select VAPT_LEGACY_DEBUG_SIGNING=true for the existing certificate.')
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
